# Publica el sitio en GitHub Pages cada vez que se sube algo a la rama main.
# Requisitos (una sola vez, en GitHub):
#   1. El repositorio se llama "sistemasdentalnakeji-art.github.io" (así el sitio queda en la raíz del dominio,
#      que es lo que necesitan las rutas del proyecto).
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions".
# La compilación es la de vista previa (npm run build): todo noindex.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
